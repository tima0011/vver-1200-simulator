<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATOMIC CORE | Интерактивный симулятор и анатомия ВВЭР-1200</title>
  
  <!-- SEO & Meta -->
  <meta name="description" content="Интерактивное образовательное веб-приложение по ядерной инженерии, теплогидравлике и физике водо-водяных энергетических реакторов ВВЭР-1200 поколения 3+.">
  <meta name="theme-color" content="#07090e">

  <!-- Typography: Google Fonts (Plus Jakarta Sans & JetBrains Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Modular Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/anatomy.css">
</head>
<body>
  <!-- Atmospheric Dark Tech Background Layers -->
  <div class="ambient-bg" aria-hidden="true">
    <div class="ambient-radial-glow"></div>
    <div class="ambient-secondary-glow"></div>
    <div class="ambient-grid"></div>
  </div>

  <!-- Primary Application Header & Telemetry Ribbon -->
  <header class="app-header">
    <div class="header-container">
      <!-- Brand & Nuclear Reactor Badge -->
      <a href="#anatomy" class="brand-link" id="app-brand-logo" aria-label="ATOMIC CORE главная">
        <div class="brand-symbol-wrapper">
          <svg class="brand-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="16" cy="16" r="14" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" stroke-dasharray="2 3"/>
            <path d="M16 4.5L25.96 10.25V21.75L16 27.5L6.04 21.75V10.25L16 4.5Z" stroke="#38bdf8" stroke-width="1.2" stroke-linejoin="round"/>
            <ellipse cx="16" cy="16" rx="12" ry="4.5" stroke="rgba(56, 189, 248, 0.45)" stroke-width="0.8" transform="rotate(-30 16 16)"/>
            <ellipse cx="16" cy="16" rx="12" ry="4.5" stroke="rgba(56, 189, 248, 0.45)" stroke-width="0.8" transform="rotate(30 16 16)"/>
            <circle cx="16" cy="16" r="2.8" fill="#38bdf8"/>
            <circle cx="16" cy="16" r="1.2" fill="#ffffff"/>
            <line x1="16" y1="2" x2="16" y2="4.5" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round"/>
            <line x1="16" y1="27.5" x2="16" y2="30" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round"/>
            <line x1="2" y1="16" x2="4.5" y2="16" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round"/>
            <line x1="27.5" y1="16" x2="30" y2="16" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">ATOMIC CORE</span>
          <span class="brand-subtitle">// ВВЭР-1200 GEN III+</span>
        </div>
      </a>

      <!-- SPA Navigation Tabs -->
      <nav class="app-nav" role="tablist" aria-label="Разделы симулятора">
        <button class="nav-tab active" data-route="anatomy" id="tab-nav-anatomy" role="tab" aria-selected="true">
          <span class="nav-tab-icon">⚛</span>
          <span>Анатомия реактора</span>
        </button>
        <button class="nav-tab" data-route="control" id="tab-nav-control" role="tab" aria-selected="false">
          <span class="nav-tab-icon">🎛</span>
          <span>Пульт оператора</span>
        </button>
        <button class="nav-tab" data-route="physics" id="tab-nav-physics" role="tab" aria-selected="false">
          <span class="nav-tab-icon">📖</span>
          <span>Физика на пальцах</span>
        </button>
      </nav>

      <!-- SCADA Telemetry, Mode Toggle & Power Station Status -->
      <div class="header-telemetry">
        <div class="telemetry-metrics-summary">
          <div class="telemetry-item">
            <span class="telemetry-label">N_тепл</span>
            <div class="telemetry-value" id="header-val-power">3200.0 <span>МВт(т)</span></div>
          </div>
          <div class="telemetry-item">
            <span class="telemetry-label">P_1конт</span>
            <div class="telemetry-value" id="header-val-pressure">16.20 <span>МПа</span></div>
          </div>
        </div>

        <!-- Global Dual Mode Switcher: [ SCADA Инженерия ] / [ Вся суть на пальцах ] -->
        <div class="mode-toggle-pill" id="global-mode-toggle" role="group" aria-label="Режим подачи информации">
          <button class="mode-btn active" data-mode="scada" id="mode-btn-scada" type="button" title="Инженерный режим: параметры, формулы и физика SCADA">
            <span class="mode-btn-icon">⚙️</span>
            <span class="mode-btn-text">SCADA Инженерия</span>
          </button>
          <button class="mode-btn" data-mode="simple" id="mode-btn-simple" type="button" title="Простой режим: бытовые аналогии и физика на пальцах">
            <span class="mode-btn-icon">💡</span>
            <span class="mode-btn-text">Вся суть на пальцах</span>
          </button>
        </div>

        <div class="status-badge" title="Статус безопасности АЭС: Все барьеры целостны">
          <span class="status-beacon"></span>
          <span class="status-text">БЛОК №1: НОМИНАЛ (100%)</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Viewport Target Container for Screens -->
  <main id="app-viewport" role="main" aria-live="polite">
    <!-- Initial Anatomy 3D Stage container populated by SPA router / AnatomyView -->
    <div id="reactor-3d-viewport" class="reactor-3d-viewport"></div>
  </main>

  <!-- 3D Graphics Engine: Three.js (r128) & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- Modular Scripts Architecture -->
  <script src="js/data.js"></script>
  <script src="js/anatomy.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
